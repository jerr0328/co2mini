[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "co2mini"
description = "Monitor CO2 levels with Prometheus, MQTT, and/or HomeKit"
readme = "README.md"
authors = [{ email = "jeremy@jerr.dev" }, { name = "Jeremy Mayeres" }]
requires-python = ">=3.10"
keywords = [
    "co2",
    "co2mini",
    "temperature",
    "humidity",
    "sensors",
    "prometheus",
    "homekit",
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]
dependencies = ["prometheus_client", "environs"]
dynamic = ["version"]

[project.urls]
repository = "https://github.com/jerr0328/co2mini"

[project.optional-dependencies]
homekit = ["hap-python"]
mqtt = ["paho-mqtt"]
all = ["co2mini[homekit,mqtt]"]

[project.scripts]
co2mini = "co2mini.main:main"

[tool.ruff.lint]
extend-select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C",    # mccabe complexity
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "FLY",  # flake8-flynt
    "FURB", # refurb
    "I",    # isort
    "LOG",  # flake8-logging
    "N",    # pep8 naming
    "PERF", # perflint
    "PGH",  # pygrep hooks
    "PIE",  # flake8-pie
    "PTH",  # flake8-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff
    "S",    # bandit security
    "SIM",  # flake8-simplify
    "T20",  # Print
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.setuptools_scm]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "ruff>=0.14.10",
    "setuptools>=80.9.0",
    "setuptools-scm>=9.2.2",
    "wheel*",
]
